<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEEKeR Camera</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#0f172a;font-family:Arial,sans-serif}.wrap{min-height:100vh;display:flex;justify-content:center;padding:24px}.card{width:min(980px,100%);background:#fff;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 10px 30px rgba(15,23,42,.08);overflow:hidden}.head{padding:20px 24px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:14px}.logo{width:44px;height:44px;border-radius:12px;background:#eff6ff;color:#2563eb;display:flex;align-items:center;justify-content:center;font-weight:800}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;color:#2563eb}.title{font-size:20px;font-weight:700;margin-top:4px}.body{padding:20px 24px}.notice{border:1px solid #dbeafe;background:#eff6ff;color:#1e40af;border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.5;margin-bottom:16px}.stage{background:#0f172a;border-radius:14px;overflow:hidden;min-height:420px;display:flex;align-items:center;justify-content:center;position:relative}.stage video{width:100%;max-height:62vh;display:block;background:#000;object-fit:contain}.placeholder{color:#cbd5e1;text-align:center;padding:40px}.placeholder strong{display:block;color:#fff;font-size:18px;margin-bottom:8px}.controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:14px}.left,.right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;font-size:12px;cursor:pointer}.primary{background:#2563eb;color:#fff}.dark{background:#0f172a;color:#fff}.light{background:#fff;color:#334155;border:1px solid #cbd5e1}.danger{background:#fff;color:#b91c1c;border:1px solid #fecaca}.btn:disabled{opacity:.45;cursor:not-allowed}.count{font-size:12px;color:#64748b}.thumbs{display:flex;gap:8px;overflow:auto;margin-top:14px}.thumb{position:relative;flex:0 0 90px;border:1px solid #cbd5e1;border-radius:9px;overflow:hidden;background:#fff}.thumb img{width:90px;height:115px;display:block;object-fit:cover}.thumb span{position:absolute;left:5px;top:5px;background:#0f172acc;color:#fff;border-radius:6px;padding:3px 5px;font-size:10px;font-weight:700}.status{margin-top:12px;font-size:12px;min-height:18px}.ok{color:#166534}.err{color:#b91c1c}@media(max-width:600px){.wrap{padding:10px}.head,.body{padding:16px}.stage{min-height:55vh}.controls{align-items:stretch}.left,.right{width:100%}.btn{flex:1}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <div class="head"><div class="logo">K</div><div><div class="eyebrow">KEEKeR CAMERA</div><div class="title">Supporting Document Capture</div></div></div>
  <div class="body">
    <div id="notice" class="notice">Click <strong>START CAMERA</strong>. Your browser may then ask for permission to use the camera. Choose <strong>Allow</strong> to continue.</div>
    <div class="stage">
      <video id="video" autoplay playsinline muted style="display:none"></video>
      <div id="placeholder" class="placeholder"><strong>Camera is not active</strong>Start the camera to begin capturing document pages.</div>
    </div>
    <div class="controls">
      <div class="left"><span id="count" class="count">0 pages captured</span></div>
      <div class="right">
        <button id="start" class="btn primary" type="button">START CAMERA</button>
        <button id="capture" class="btn light" type="button" disabled>CAPTURE PAGE</button>
        <button id="retake" class="btn danger" type="button" disabled>RETAKE LAST</button>
        <button id="done" class="btn dark" type="button" disabled>DONE</button>
        <button id="cancel" class="btn light" type="button">CANCEL</button>
      </div>
    </div>
    <div id="thumbs" class="thumbs"></div>
    <div id="status" class="status"></div>
    <canvas id="canvas" style="display:none"></canvas>
  </div>
</div></div>
<script>
(function(){
  var video=document.getElementById('video'), canvas=document.getElementById('canvas');
  var placeholder=document.getElementById('placeholder'), start=document.getElementById('start');
  var capture=document.getElementById('capture'), retake=document.getElementById('retake'), done=document.getElementById('done'), cancel=document.getElementById('cancel');
  var count=document.getElementById('count'), thumbs=document.getElementById('thumbs'), status=document.getElementById('status');
  var stream=null, pages=[];
  var maxWidth=1800;

  function setStatus(message,type){status.className='status '+(type||'');status.textContent=message||'';}
  function update(){count.textContent=pages.length+' page'+(pages.length===1?'':'s')+' captured';retake.disabled=!pages.length;done.disabled=!pages.length;}
  function stop(){if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}video.srcObject=null}
  function renderThumbs(){thumbs.innerHTML='';pages.forEach(function(data,i){var d=document.createElement('div');d.className='thumb';d.innerHTML='<img src="'+data+'"><span>PAGE '+(i+1)+'</span>';thumbs.appendChild(d)})}

  async function startCamera(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setStatus('Camera access is not available in this browser.','err');return}
    try{
      setStatus('Requesting camera permission...');
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
      video.srcObject=stream;video.style.display='block';placeholder.style.display='none';
      capture.disabled=false;start.textContent='RESTART CAMERA';setStatus('Camera ready. Position the document and capture each page.','ok');
    }catch(e){console.error(e);setStatus('Camera permission was denied or the camera is unavailable. Please allow camera access and try again.','err')}
  }

  function capturePage(){
    if(!video.videoWidth){setStatus('Camera is not ready yet.','err');return}
    var scale=Math.min(1,maxWidth/video.videoWidth),w=Math.round(video.videoWidth*scale),h=Math.round(video.videoHeight*scale);canvas.width=w;canvas.height=h;var ctx=canvas.getContext('2d');ctx.drawImage(video,0,0,w,h);pages.push(canvas.toDataURL('image/jpeg',0.85));renderThumbs();update();setStatus('Page '+pages.length+' captured. You may capture another page.','ok')
  }
  function retakeLast(){if(!pages.length)return;pages.pop();renderThumbs();update();setStatus('Last captured page removed. Capture it again.','ok')}
  function finish(){if(!pages.length){setStatus('Capture at least one page before selecting DONE.','err');return}stop();setStatus('Returning captured pages to KEEKeR...','ok');var target='*';try{var o=new URLSearchParams(location.search).get('returnOrigin');if(o&&o!=='null')target=o}catch(e){};if(window.opener&&!window.opener.closed){window.opener.postMessage({source:'KEEKeR_CAMERA',type:'CAMERA_RESULT',pages:pages},target);setTimeout(function(){window.close()},150)}else{setStatus('The KEEKeR window is no longer available. Please close this window and try again.','err')}}
  function cancelCamera(){stop();if(window.opener&&!window.opener.closed){var target='*';try{var o=new URLSearchParams(location.search).get('returnOrigin');if(o&&o!=='null')target=o}catch(e){};window.opener.postMessage({source:'KEEKeR_CAMERA',type:'CAMERA_CANCEL'},target)}setTimeout(function(){window.close()},100)}
  start.addEventListener('click',startCamera);capture.addEventListener('click',capturePage);retake.addEventListener('click',retakeLast);done.addEventListener('click',finish);cancel.addEventListener('click',cancelCamera);window.addEventListener('beforeunload',stop);update();
})();
</script>
</body>
</html>
