<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEEKeR Transaction - Camera Capture</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#f8fafc;
    color:#0f172a;
    font-family:Arial,sans-serif;
}

.wrap{
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:0;
}

.card{
    width:100%;
    min-height:100vh;
    background:#fff;
    border:0;
    border-radius:0;
    box-shadow:none;
    overflow:hidden;
}

.head{
    padding:16px 24px;
    border-bottom:1px solid #e2e8f0;
    display:flex;
    align-items:center;
    gap:14px;
}

.logo{
    width:44px;
    height:44px;
    border-radius:12px;
    background:#eff6ff;
    color:#2563eb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
}

.eyebrow{
    font-size:11px;
    font-weight:800;
    letter-spacing:.16em;
    color:#2563eb;
}

.title{
    font-size:20px;
    font-weight:700;
    margin-top:4px;
}

.body{
    padding:18px 24px 24px;
}

.notice{
    border:1px solid #dbeafe;
    background:#eff6ff;
    color:#1e40af;
    border-radius:12px;
    padding:12px 14px;
    font-size:13px;
    line-height:1.5;
    margin-bottom:16px;
}

.stage{
    background:#0f172a;
    border-radius:10px;
    overflow:hidden;
    min-height:calc(100vh - 210px);
    height:calc(100vh - 210px);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.stage video{
    width:100%;
    height:100%;
    max-height:none;
    display:block;
    background:#000;
    object-fit:contain;
}

.placeholder{
    color:#cbd5e1;
    text-align:center;
    padding:40px;
}

.placeholder strong{
    display:block;
    color:#fff;
    font-size:18px;
    margin-bottom:8px;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:space-between;
    align-items:center;
    margin-top:14px;
}

.left,
.right{
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
}

.btn{
    border:0;
    border-radius:10px;
    padding:11px 16px;
    font-weight:700;
    font-size:12px;
    cursor:pointer;
}

.primary{
    background:#2563eb;
    color:#fff;
}

.dark{
    background:#0f172a;
    color:#fff;
}

.light{
    background:#fff;
    color:#334155;
    border:1px solid #cbd5e1;
}

.danger{
    background:#fff;
    color:#b91c1c;
    border:1px solid #fecaca;
}

.btn:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.count{
    font-size:12px;
    color:#64748b;
}

.thumbs{
    display:flex;
    gap:8px;
    overflow:auto;
    margin-top:14px;
}

.thumb{
    position:relative;
    flex:0 0 90px;
    border:1px solid #cbd5e1;
    border-radius:9px;
    overflow:hidden;
    background:#fff;
}

.thumb img{
    width:90px;
    height:115px;
    display:block;
    object-fit:cover;
}

.thumb span{
    position:absolute;
    left:5px;
    top:5px;
    background:#0f172acc;
    color:#fff;
    border-radius:6px;
    padding:3px 5px;
    font-size:10px;
    font-weight:700;
}

.status{
    margin-top:12px;
    font-size:12px;
    min-height:18px;
}

.ok{
    color:#166534;
}

.err{
    color:#b91c1c;
}

@media(max-width:800px){
    .head,
    .body{
        padding:14px;
    }

    .stage{
        min-height:calc(100vh - 225px);
        height:calc(100vh - 225px);
    }

    .controls{
        align-items:stretch;
    }

    .left,
    .right{
        width:100%;
    }

    .btn{
        flex:1;
    }
}
</style>
</head>

<body>

<div class="wrap">
<div class="card">

    <div class="head">
        <div class="logo">K</div>

        <div>
            <div class="eyebrow">KEEKeR</div>
            <div class="title">KEEKeR Transaction</div>
            <div style="font-size:13px;color:#64748b;margin-top:3px">
                Supporting Document Capture
            </div>
        </div>
    </div>

    <div class="body">

        <div id="notice" class="notice">
            Click <strong>START CAMERA</strong>.
            Your browser may then ask for permission to use the camera.
            Choose <strong>Allow</strong> to continue.
        </div>

        <div class="stage">

            <video
                id="video"
                autoplay
                playsinline
                muted
                style="display:none">
            </video>

            <div id="placeholder" class="placeholder">
                <strong>Camera is not active</strong>
                Start the camera to begin capturing document pages.
            </div>

        </div>

        <div class="controls">

            <div class="left">
                <span id="count" class="count">
                    0 pages captured
                </span>
            </div>

            <div class="right">

                <button
                    id="start"
                    class="btn primary"
                    type="button">
                    START CAMERA
                </button>

                <button
                    id="capture"
                    class="btn light"
                    type="button"
                    disabled>
                    CAPTURE PAGE
                </button>

                <button
                    id="retake"
                    class="btn danger"
                    type="button"
                    disabled>
                    RETAKE LAST
                </button>

                <button
                    id="done"
                    class="btn dark"
                    type="button"
                    disabled>
                    DONE
                </button>

                <button
                    id="cancel"
                    class="btn light"
                    type="button">
                    CANCEL
                </button>

            </div>
        </div>

        <div id="thumbs" class="thumbs"></div>

        <div id="status" class="status"></div>

        <canvas id="canvas" style="display:none"></canvas>

    </div>
</div>
</div>

<script>
(function(){

    var video = document.getElementById('video');
    var canvas = document.getElementById('canvas');

    var placeholder = document.getElementById('placeholder');
    var start = document.getElementById('start');
    var capture = document.getElementById('capture');
    var retake = document.getElementById('retake');
    var done = document.getElementById('done');
    var cancel = document.getElementById('cancel');

    var count = document.getElementById('count');
    var thumbs = document.getElementById('thumbs');
    var status = document.getElementById('status');

    var stream = null;
    var pages = [];
    var maxWidth = 1800;


    function setStatus(message,type){

        status.className = 'status ' + (type || '');
        status.textContent = message || '';

    }


    function update(){

        count.textContent =
            pages.length +
            ' page' +
            (pages.length === 1 ? '' : 's') +
            ' captured';

        retake.disabled = !pages.length;
        done.disabled = !pages.length;

    }


    function stop(){

        if(stream){

            stream.getTracks().forEach(function(track){
                track.stop();
            });

            stream = null;

        }

        video.srcObject = null;

    }


    function renderThumbs(){

        thumbs.innerHTML = '';

        pages.forEach(function(data,i){

            var d = document.createElement('div');

            d.className = 'thumb';

            d.innerHTML =
                '<img src="' + data + '">' +
                '<span>PAGE ' + (i + 1) + '</span>';

            thumbs.appendChild(d);

        });

    }


    async function startCamera(){

        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            setStatus(
                'Camera access is not available in this browser.',
                'err'
            );

            return;
        }


        try{

            setStatus('Requesting camera permission...');


            stream =
                await navigator.mediaDevices.getUserMedia({

                    video:{
                        facingMode:{ideal:'environment'},
                        width:{ideal:1920},
                        height:{ideal:1080}
                    },

                    audio:false

                });


            video.srcObject = stream;

            video.style.display = 'block';

            placeholder.style.display = 'none';

            capture.disabled = false;

            start.textContent = 'RESTART CAMERA';

            setStatus(
                'Camera ready. Position the document and capture each page.',
                'ok'
            );

        }
        catch(e){

            console.error(e);

            setStatus(
                'Camera permission was denied or the camera is unavailable. Please allow camera access and try again.',
                'err'
            );

        }

    }


    function capturePage(){

        if(!video.videoWidth){

            setStatus(
                'Camera is not ready yet.',
                'err'
            );

            return;
        }


        var scale =
            Math.min(
                1,
                maxWidth / video.videoWidth
            );


        var w =
            Math.round(
                video.videoWidth * scale
            );


        var h =
            Math.round(
                video.videoHeight * scale
            );


        canvas.width = w;
        canvas.height = h;


        var ctx =
            canvas.getContext('2d');


        ctx.drawImage(
            video,
            0,
            0,
            w,
            h
        );


        pages.push(
            canvas.toDataURL(
                'image/jpeg',
                0.85
            )
        );


        renderThumbs();
        update();


        setStatus(
            'Page ' +
            pages.length +
            ' captured. You may capture another page.',
            'ok'
        );

    }


    function retakeLast(){

        if(!pages.length){
            return;
        }


        pages.pop();

        renderThumbs();
        update();


        setStatus(
            'Last captured page removed. Capture it again.',
            'ok'
        );

    }


    function getReturnOrigin(){

        var target = '*';

        try{

            var o =
                new URLSearchParams(
                    location.search
                ).get('returnOrigin');


            if(o && o !== 'null'){
                target = o;
            }

        }
        catch(e){}


        return target;

    }


    function finish(){

        if(!pages.length){

            setStatus(
                'Capture at least one page before selecting DONE.',
                'err'
            );

            return;
        }


        stop();


        setStatus(
            'Returning captured pages to KEEKeR...',
            'ok'
        );


        var target = getReturnOrigin();


        if(
            window.opener &&
            !window.opener.closed
        ){

            window.opener.postMessage({

                source:'KEEKeR_CAMERA',

                type:'CAMERA_RESULT',

                pages:pages

            },target);


            setTimeout(function(){

                window.close();

            },150);

        }
        else{

            setStatus(
                'The KEEKeR window is no longer available. Please close this window and try again.',
                'err'
            );

        }

    }


    function cancelCamera(){

        stop();


        if(
            window.opener &&
            !window.opener.closed
        ){

            var target = getReturnOrigin();


            window.opener.postMessage({

                source:'KEEKeR_CAMERA',

                type:'CAMERA_CANCEL'

            },target);

        }


        setTimeout(function(){

            window.close();

        },100);

    }


    start.addEventListener(
        'click',
        startCamera
    );


    capture.addEventListener(
        'click',
        capturePage
    );


    retake.addEventListener(
        'click',
        retakeLast
    );


    done.addEventListener(
        'click',
        finish
    );


    cancel.addEventListener(
        'click',
        cancelCamera
    );


    window.addEventListener(
        'beforeunload',
        stop
    );


    update();

})();
</script>



<!-- QR scanner support for KEEKeR Receive. The existing document-capture mode remains unchanged. -->
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  if (params.get('mode') !== 'qr') return;

  var video = document.getElementById('video');
  var canvas = document.getElementById('canvas');
  var placeholder = document.getElementById('placeholder');
  var start = document.getElementById('start');
  var capture = document.getElementById('capture');
  var retake = document.getElementById('retake');
  var done = document.getElementById('done');
  var cancel = document.getElementById('cancel');
  var count = document.getElementById('count');
  var thumbs = document.getElementById('thumbs');
  var status = document.getElementById('status');
  var notice = document.getElementById('notice');
  var title = document.querySelector('.title');
  var subtitle = title && title.parentElement ? title.parentElement.querySelector('div[style]') : null;

  /* Replace the document-capture handlers with QR-mode handlers. */
  if (start) start = start.cloneNode(true);
  if (cancel) cancel = cancel.cloneNode(true);
  var oldStart = document.getElementById('start');
  var oldCancel = document.getElementById('cancel');
  if (oldStart && start) oldStart.parentNode.replaceChild(start, oldStart);
  if (oldCancel && cancel) oldCancel.parentNode.replaceChild(cancel, oldCancel);

  if (capture) capture.style.display = 'none';
  if (retake) retake.style.display = 'none';
  if (done) done.style.display = 'none';
  if (thumbs) thumbs.style.display = 'none';
  if (count) count.style.display = 'none';
  if (title) title.textContent = 'KEEKeR QR Scanner';
  if (subtitle) subtitle.textContent = 'Scan Transaction QR Code';
  if (notice) notice.innerHTML = 'Allow camera access when your browser asks. The scanner will start automatically.';
  if (placeholder) placeholder.innerHTML = '<strong>Camera is starting...</strong>Please allow camera access to scan a KEEKeR transaction QR code.';
  if (start) start.textContent = 'START CAMERA';
  if (cancel) cancel.textContent = 'CANCEL';

  var qrStream = null;
  var scanning = false;
  var resultSent = false;
  var animationId = null;
  var lastScanTime = 0;
  var scanBusy = false;
  var scanCanvas = document.createElement('canvas');
  var scanCtx = scanCanvas.getContext('2d', {willReadFrequently:true});
  var nativeDetector = null;
  if ('BarcodeDetector' in window) {
    try {
      nativeDetector = new BarcodeDetector({formats:['qr_code']});
    } catch(e) {
      nativeDetector = null;
    }
  }

  function setStatus(message,type){
    if (!status) return;
    status.className = 'status ' + (type || '');
    status.textContent = message || '';
  }

  function stopCamera(){
    scanning = false;
    scanBusy = false;
    if (animationId) {
      cancelAnimationFrame(animationId);
      animationId = null;
    }
    if (qrStream) {
      qrStream.getTracks().forEach(function(track){ track.stop(); });
      qrStream = null;
    }
    if (video) video.srcObject = null;
  }

  function getReturnOrigin(){
    var target = '*';
    try{
      var o = new URLSearchParams(location.search).get('returnOrigin');
      if (o && o !== 'null') target = o;
    }catch(e){}
    return target;
  }

  function sendQRResult(text){
    if (resultSent) return;
    resultSent = true;
    stopCamera();
    if (notice) notice.style.display = 'none';
    setStatus('QR code detected. Returning transaction to KEEKeR...','ok');

    if (window.opener && !window.opener.closed) {
      window.opener.postMessage({
        source:'KEEKeR_CAMERA',
        type:'QR_RESULT',
        qrToken:String(text || '').trim()
      }, getReturnOrigin());
      setTimeout(function(){ window.close(); }, 250);
    } else {
      resultSent = false;
      setStatus('QR code detected, but the KEEKeR window is no longer available.','err');
    }
  }

  function decodeImage(data,width,height){
    if (!window.jsQR || !data || !width || !height) return null;
    try{
      return window.jsQR(data,width,height,{inversionAttempts:'attemptBoth'});
    }catch(e){
      return null;
    }
  }

  function tryDecodeFrame(){
    if (!video || !video.videoWidth || !video.videoHeight) return null;

    var sourceWidth = video.videoWidth;
    var sourceHeight = video.videoHeight;
    var maxWidth = 1280;
    var scale = Math.min(1,maxWidth/sourceWidth);
    var width = Math.max(320,Math.round(sourceWidth*scale));
    var height = Math.max(240,Math.round(sourceHeight*scale));

    /* First attempt: the complete frame at a practical scanning resolution. */
    scanCanvas.width = width;
    scanCanvas.height = height;
    scanCtx.drawImage(video,0,0,width,height);
    var imageData = scanCtx.getImageData(0,0,width,height);
    var code = decodeImage(imageData.data,width,height);
    if (code && code.data) return code.data;

    /* Second attempt: center crop. This gives jsQR a larger QR region when
       the user holds a phone/document in the middle of the webcam view. */
    var cropRatio = 0.72;
    var cropWidth = Math.round(width*cropRatio);
    var cropHeight = Math.round(height*cropRatio);
    var cropX = Math.round((width-cropWidth)/2);
    var cropY = Math.round((height-cropHeight)/2);
    var cropCanvas = document.createElement('canvas');
    cropCanvas.width = cropWidth;
    cropCanvas.height = cropHeight;
    var cropCtx = cropCanvas.getContext('2d',{willReadFrequently:true});
    cropCtx.drawImage(scanCanvas,cropX,cropY,cropWidth,cropHeight,0,0,cropWidth,cropHeight);
    var cropData = cropCtx.getImageData(0,0,cropWidth,cropHeight);
    code = decodeImage(cropData.data,cropWidth,cropHeight);
    if (code && code.data) return code.data;

    /* Third attempt: square center crop, useful for a QR held close to the
       laptop camera with dark areas around it. */
    var side = Math.min(width,height);
    var sx = Math.round((width-side)/2);
    var sy = Math.round((height-side)/2);
    var squareCanvas = document.createElement('canvas');
    squareCanvas.width = side;
    squareCanvas.height = side;
    var squareCtx = squareCanvas.getContext('2d',{willReadFrequently:true});
    squareCtx.drawImage(scanCanvas,sx,sy,side,side,0,0,side,side);
    var squareData = squareCtx.getImageData(0,0,side,side);
    code = decodeImage(squareData.data,side,side);
    return code && code.data ? code.data : null;
  }

  async function scanFrame(timestamp){
    if (!scanning || resultSent) return;

    if (!video || video.readyState < 2 || !video.videoWidth || !video.videoHeight) {
      animationId = requestAnimationFrame(scanFrame);
      return;
    }

    /* Limit decoding to about 7 attempts per second so the laptop CPU is not
       overwhelmed while the webcam continues displaying smoothly. */
    if (timestamp - lastScanTime >= 140 && !scanBusy) {
      lastScanTime = timestamp;
      scanBusy = true;
      try{
        /* First use the browser's native QR decoder when available. It is
           generally more tolerant of QR codes displayed on a phone and of
           codes containing a center logo. */
        if (nativeDetector) {
          try {
            var nativeResults = await nativeDetector.detect(video);
            if (nativeResults && nativeResults.length) {
              var nativeText = nativeResults[0].rawValue;
              if (nativeText) {
                sendQRResult(nativeText);
                return;
              }
            }
          } catch(e) {
            /* Fall through to jsQR. */
          }
        }

        var text = tryDecodeFrame();
        if (text) {
          sendQRResult(text);
          return;
        }
      }finally{
        scanBusy = false;
      }
    }

    animationId = requestAnimationFrame(scanFrame);
  }

  async function startQRScanner(){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus('Camera access is not available in this browser. Please use Chrome or Edge.','err');
      return;
    }
    if (!window.jsQR) {
      setStatus('QR scanner library is unavailable. Please refresh the camera page and try again.','err');
      return;
    }

    stopCamera();
    resultSent = false;
    setStatus('Requesting camera permission...');
    if (start) {
      start.disabled = true;
      start.textContent = 'STARTING CAMERA...';
    }

    try{
      qrStream = await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:{ideal:'environment'},
          width:{ideal:1920},
          height:{ideal:1080}
        },
        audio:false
      });

      video.srcObject = qrStream;
      video.style.display = 'block';
      if (placeholder) placeholder.style.display = 'none';
      if (notice) notice.style.display = 'none';
      if (start) {
        start.disabled = false;
        start.textContent = 'RESTART CAMERA';
      }
      setStatus(nativeDetector ? 'Scanning for QR code...':'Scanning for QR code...','ok');
      scanning = true;
      lastScanTime = 0;
      animationId = requestAnimationFrame(scanFrame);
    }catch(e){
      console.error(e);
      if (start) {
        start.disabled = false;
        start.textContent = 'START CAMERA';
      }
      if (notice) notice.style.display = '';
      var name = e && e.name ? String(e.name) : '';
      if (name === 'NotAllowedError' || name === 'PermissionDeniedError') {
        setStatus('Camera permission was denied. Please allow camera access for this GitHub camera page and try again.','err');
      } else {
        setStatus('Unable to start the camera. Please check that your webcam is available and try again.','err');
      }
    }
  }

  function cancelQRScanner(){
    stopCamera();
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage({
        source:'KEEKeR_CAMERA',
        type:'CAMERA_CANCEL'
      }, getReturnOrigin());
    }
    setTimeout(function(){ window.close(); }, 100);
  }

  if (start) start.addEventListener('click',startQRScanner);
  if (cancel) cancel.addEventListener('click',cancelQRScanner);
  window.addEventListener('beforeunload',stopCamera);

  /* Receive QR mode starts the camera automatically. */
  setTimeout(startQRScanner,250);
})();
</script>
</body>
</html>
